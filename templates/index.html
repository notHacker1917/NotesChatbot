<!DOCTYPE html>
<html>
<head>
    <title>Notes Chatbot</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f0f0f0; }
        .chatbox { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .response { background: #e0e0e0; padding: 10px; margin-top: 10px; border-radius: 5px; }
        input[type=text] { width: 80%; padding: 10px; }
        input[type=submit] { padding: 10px; }
    </style>
</head>
<body>
    <div class="chatbox">
        <h2>Notes Chatbot</h2>
        <form method="post" action="/query">
            <input type="text" name="user_query" placeholder="Ask something..." required>
            <input type="submit" value="Send">
        </form>
        {% if query %}
        <p><b>You:</b> {{ query }}</p>
        <div class="response"><b>Bot:</b> {{ response }}</div>
        {% endif %}
    </div>
</body>
</html>
